<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Helpu — Rides & Campus Connect</title>

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="background-color" content="#FFFFFF" />
    <meta name="description" content="Verified campus carpooling and smart peer travel network for university students." />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Apple iOS Standalone Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Helpu" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />

    <!-- Android / Chrome Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Helpu" />
    <meta name="msapplication-TileColor" content="#FFFFFF" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      /* Standalone PWA App Splash Screen Loader */
      #pwa-splash {
        position: fixed;
        inset: 0;
        background-color: #FFFFFF;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 99999;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
      }
      .splash-logo-img {
        height: 48px;
        max-width: 220px;
        width: auto;
        object-fit: contain;
        display: block;
        user-select: none;
      }
      .splash-spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid rgba(255, 87, 46, 0.25);
        border-top-color: #FF572E;
        border-radius: 9999px;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#FFF8F3] text-[#17233C] antialiased">
    <div id="root">
      <!-- Initial Splash Screen while React App Hydrates -->
      <div id="pwa-splash">
        <img src="/logo.png" alt="Helpu" class="splash-logo-img" />
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
