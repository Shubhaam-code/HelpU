<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Helpu — Rides & Campus Connect</title>

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#FF572E" />
    <meta name="background-color" content="#FFF8F3" />
    <meta name="description" content="Verified campus carpooling and smart peer travel network for university students." />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Apple iOS Standalone Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Helpu" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />

    <!-- Android / Chrome Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Helpu" />
    <meta name="msapplication-TileColor" content="#FF572E" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      /* Standalone PWA App Splash Screen Loader */
      #pwa-splash {
        position: fixed;
        inset: 0;
        background-color: #FFF8F3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
      }
      .splash-logo-box {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 28px;
        background: #FFFFFF;
        border: 1px solid #F4E3D8;
        box-shadow: 0 10px 25px rgba(255, 87, 46, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splash-pulse 2s infinite ease-in-out;
      }
      .splash-logo-box img {
        width: 58px;
        height: 58px;
        object-fit: contain;
      }
      .splash-brand {
        margin-top: 18px;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.5px;
        color: #17233C;
      }
      .splash-brand span {
        color: #FF572E;
      }
      .splash-tagline {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #8C93A4;
      }
      .splash-spinner-bar {
        margin-top: 28px;
        width: 120px;
        height: 4px;
        background: #F4E3D8;
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .splash-spinner-progress {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: #FF572E;
        border-radius: 9999px;
        animation: splash-slide 1.2s infinite ease-in-out;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes splash-slide {
        0% { left: -40%; width: 40%; }
        50% { left: 40%; width: 60%; }
        100% { left: 100%; width: 40%; }
      }
    </style>
  </head>
  <body class="bg-[#FFF8F3] text-[#17233C] antialiased">
    <div id="root">
      <!-- Initial Splash Screen while React App Hydrates -->
      <div id="pwa-splash">
        <div class="splash-logo-box">
          <img src="/logo-icon.png" alt="Helpu" />
        </div>
        <div class="splash-brand">
          Help<span>u</span>
        </div>
        <div class="splash-tagline">
          Campus Rides &amp; Connect
        </div>
        <div class="splash-spinner-bar">
          <div class="splash-spinner-progress"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
