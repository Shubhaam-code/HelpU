<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Returning to Helpu...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FFF8F3;
      color: #17233C;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #F4E3D8;
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 12px 36px rgba(23, 35, 60, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-wrap {
      width: 68px;
      height: 68px;
      background: #FFE4D5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      position: relative;
    }
    .spinner {
      position: absolute;
      inset: -4px;
      border: 3px solid transparent;
      border-top-color: #FF572E;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .check {
      font-size: 32px;
      line-height: 1;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      color: #17233C;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 14px;
      color: #6E7587;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px 24px;
      background-color: #FF572E;
      color: #FFFFFF !important;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(255, 87, 46, 0.35);
      border: none;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active {
      transform: scale(0.97);
      background-color: #E64A22;
    }
    .subtext {
      margin-top: 18px;
      font-size: 11px;
      font-weight: 600;
      color: #8B93A7;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <div class="spinner"></div>
      <div class="check">✅</div>
    </div>
    <h1>Authentication Verified!</h1>
    <p>Returning to the Helpu app. Tap below to continue if your app doesn't open automatically:</p>
    <a id="launch-btn" class="btn" href="#">
      <span>Open Helpu App</span>
      <span>&rarr;</span>
    </a>
    <div class="subtext">Campus Verified Student Network</div>
  </div>

  <script>
    (function() {
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      var deepLink = 'com.helpu.app://callback' + search + hash;
      var intentUrl = 'intent://callback' + search + hash + '#Intent;scheme=com.helpu.app;package=com.helpu.app;end;';

      var btn = document.getElementById('launch-btn');
      if (btn) {
        btn.href = deepLink;
        btn.addEventListener('click', function(e) {
          // Attempt intent on click
          try {
            window.location.href = intentUrl;
          } catch (_) {
            window.location.href = deepLink;
          }
        });
      }

      // Safe non-destructive auto-launch attempt via hidden iframe so document DOM is NEVER blanked
      try {
        var iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = deepLink;
        document.body.appendChild(iframe);
        setTimeout(function() {
          try { document.body.removeChild(iframe); } catch(_) {}
        }, 1200);
      } catch (_) {}

      // Fallback intent launch attempt after 700ms
      setTimeout(function() {
        try {
          window.location.href = intentUrl;
        } catch (_) {}
      }, 700);
    })();
  </script>
</body>
</html>
