<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF572E" />
  <title>Helpu — Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #FFF8F3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #17233C;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #F4E3D8;
      border-radius: 28px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(255, 87, 46, 0.06);
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: #FFF0E6;
      border: 1px solid #FDE0D0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #FFF4ED;
      color: #FF572E;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      border: 1px solid #FDE0D0;
    }
    h1 {
      font-size: 22px;
      font-weight: 900;
      color: #17233C;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 13px;
      color: #6E7587;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      background: #FF572E;
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 87, 46, 0.25);
      transition: all 0.2s ease;
    }
    .retry-btn:hover {
      background: #E64A22;
      transform: translateY(-1px);
    }
    .retry-btn:active {
      transform: translateY(0);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #DC2626;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      ⚡
    </div>
    <div class="badge">
      <span class="status-dot"></span>
      <span>No Internet Connection</span>
    </div>
    <h1>You're Currently Offline</h1>
    <p>
      Helpu requires an active connection to search campus rides, verify travel matches, and coordinate bookings. Please check your mobile data or Wi-Fi.
    </p>
    <button class="retry-btn" onclick="retry()">
      <span>🔄</span>
      <span>Retry Connection</span>
    </button>
  </div>

  <script>
    function retry() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        const btn = document.querySelector('.retry-btn');
        btn.textContent = 'Still offline... check Wi-Fi';
        setTimeout(() => {
          btn.innerHTML = '<span>🔄</span><span>Retry Connection</span>';
        }, 2000);
      }
    }
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
